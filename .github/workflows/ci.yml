name: ci

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore WalnutDb.sln
      - name: Build
        run: dotnet build WalnutDb.sln --configuration Release --no-restore -p:GeneratePackageOnBuild=false /warnaserror
      - name: Test
        run: dotnet test WalnutDb.sln --configuration Release --no-build --no-restore --verbosity normal
      - name: Pack
        run: dotnet pack WalnutDb/WalnutDb.csproj -c Release --no-build --no-restore -o ./artifacts
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ runner.os }}
          path: artifacts/*.nupkg
